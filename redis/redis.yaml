# DEFAULT Redis: one instance with AOF persistence, like Compose's single
# redis container but with persistence on, so a restart keeps in-flight
# transfers. No password (= Compose); the NetworkPolicy limits access to the
# PM4ML pods. Any Redis 6+ works instead (managed, or redis/values-redis-ha.yaml):
# point CACHE_URL / REDIS_URL / redis.host in values-pm4ml.yaml at it.
#
#   kubectl -n <ns> apply -f redis/redis.yaml
apiVersion: v1
kind: Service
metadata:
  name: pm4ml-redis
  labels: { app.kubernetes.io/name: pm4ml-redis }
spec:
  selector: { app.kubernetes.io/name: pm4ml-redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pm4ml-redis
  labels: { app.kubernetes.io/name: pm4ml-redis }
spec:
  serviceName: pm4ml-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pm4ml-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pm4ml-redis }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7.2.5-alpine
          args: ["--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
          ports:
            - { containerPort: 6379, name: redis }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pm4ml-redis
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pm4ml-redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: pm4ml } }
      ports:
        - { port: 6379 }
