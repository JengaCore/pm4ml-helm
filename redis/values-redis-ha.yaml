# PRODUCTION Redis: dandydeveloper/redis-ha 4.35.5 (3 Redis + Sentinel, 2 HAProxy).
# Validated 2026-11-18 (DFSP pm4mlhelm02 on sbx UAT): the Redis master was
# killed in the middle of 60 payments and all 60 completed. The single
# redis/redis.yaml lost 47 of 60 in the same test; it is for test and small pilots.
#
#   helm upgrade --install <release>-redis dandydeveloper/redis-ha --version 4.35.5 \
#     -n <ns> -f redis/values-redis-ha.yaml --set fullnameOverride=<release>-redis-ha
#
# Then point the DFSP at <release>-redis-ha-haproxy:6379 (CACHE_URL for the SDK
# and management-api, REDIS_URL for the core connector, scheme-adapter redis.host).
#
# No password: like Compose. Access is limited by the NetworkPolicy below to
# this release's pods. To add one, set auth/existingSecret here and put the
# password in the CACHE_URL values from your secret store.
fullnameOverride: pm4ml-redis-ha   # CHANGE ME: <release>-redis-ha
replicas: 3
auth: false
hardAntiAffinity: true             # one Redis per node; needs 3 nodes
rbac:
  create: true                     # needs Role/RoleBinding rights; false works too (no Sentinel pod-label updates)
image:
  repository: public.ecr.aws/docker/library/redis
  tag: 8.2.2-alpine
persistentVolume:
  enabled: true                    # in-flight payment state survives a full restart
  size: 2Gi
redis:
  config:
    appendonly: "yes"
    appendfsync: everysec
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
haproxy:
  enabled: true
  replicas: 2
  hardAntiAffinity: true
  image:
    repository: public.ecr.aws/docker/library/haproxy
    tag: 3.0.8-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
networkPolicy:
  enabled: true
  ingressRules:
    - selectors:
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: pm4ml }   # CHANGE ME: <release>
      ports:
        - { port: 6379, protocol: TCP }
        - { port: 26379, protocol: TCP }
