# OPTION for Vault with key shares: unseal it automatically after a restart,
# every minute, from 3 key shares kept in Secret pm4ml-vault-unseal (keys
# key-0, key-1, key-2). The sbx switch runs the same pattern for its own Vault.
#
# Trade-off: the shares then live in the cluster, next to the data. Anyone who
# can read that Secret can open the store, which is the same trust boundary as
# OpenBao's static seal (secret-store/openbao), but with more moving parts.
# Prefer OpenBao static seal or a cloud KMS seal; use this only if Vault with
# Shamir is a requirement and nobody can be on call to unseal.
#
#   kubectl -n <ns> create secret generic pm4ml-vault-unseal \
#     --from-literal=key-0=... --from-literal=key-1=... --from-literal=key-2=...
#   kubectl -n <ns> apply -f jobs/vault-unsealer-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pm4ml-vault-unsealer
  labels: { app.kubernetes.io/name: store-bootstrap, app.kubernetes.io/instance: pm4ml }
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels: { app.kubernetes.io/name: store-bootstrap, app.kubernetes.io/instance: pm4ml }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534                # makes the mounted Secret readable
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: keys
              secret: { secretName: pm4ml-vault-unseal, defaultMode: 0400 }
          containers:
            - name: unseal
              image: alpine/k8s:1.31.4          # curl, jq
              env:
                - { name: A, value: "http://pm4ml-vault:8200" }
              command:
                - sh
                - -ec
                - |
                  st=$(curl -s -m 5 "$A/v1/sys/seal-status")
                  [ "$(echo "$st" | jq -r .initialized)" = "true" ] || { echo "not initialised"; exit 0; }
                  [ "$(echo "$st" | jq -r .sealed)" = "true" ] || exit 0
                  for k in /keys/key-0 /keys/key-1 /keys/key-2; do
                    curl -s -m 5 -X PUT "$A/v1/sys/unseal" --data "$(jq -cn --rawfile k "$k" '{key: ($k|rtrimstr("\n"))}')" | jq -c '{sealed, progress}'
                  done
                  [ "$(curl -s -m 5 "$A/v1/sys/seal-status" | jq -r .sealed)" = "false" ] || { echo "still sealed"; exit 1; }
                  echo "unsealed"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 64Mi }
              volumeMounts:
                - { name: keys, mountPath: /keys, readOnly: true }
