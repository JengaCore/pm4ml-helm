# Inbound callbacks from the hub. The SDK terminates mutual TLS itself
# (INBOUND_MUTUAL_TLS_ENABLED + IN_* certificates), so the gateway must pass
# TLS through untouched. Terminating TLS here and forwarding plain HTTP to
# port 4000 (what the upstream VirtualService did) cannot work: port 4000
# speaks HTTPS.
#
# Only the inbound port is published. The outbound API (4001) and the core
# connector (3003/3004) accept unauthenticated requests that move money. Keep
# them inside the cluster and reach them from your core banking system over a
# private network.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pm4ml-callbacks
spec:
  selector:
    istio: ingressgateway        # CHANGE ME: your ingress gateway's labels
  servers:
    - port: { number: 443, name: tls-pm4ml, protocol: TLS }
      tls: { mode: PASSTHROUGH }
      hosts: [ "ml-connect.CHANGE-ME-pm4ml-domain" ]   # the callback host given to the hub
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: pm4ml-callbacks
spec:
  gateways: [ pm4ml-callbacks ]
  hosts: [ "ml-connect.CHANGE-ME-pm4ml-domain" ]
  tls:
    - match:
        - port: 443
          sniHosts: [ "ml-connect.CHANGE-ME-pm4ml-domain" ]
      route:
        - destination:
            host: pm4ml-sdk-scheme-adapter-api-svc
            port: { number: 4000 }
