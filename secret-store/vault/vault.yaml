# DEFAULT secret store: HashiCorp Vault 1.13.3, the same version and layout as
# JengaCore/pm4ml-docker-compose (file storage, AppRole for management-api,
# PKI at pki/, KV v1 at secrets/). Single replica: management-api is only on
# the onboarding/renewal path, so transfers keep running while it is down.
#
#   kubectl -n <ns> apply -f secret-store/vault/vault.yaml
#   NS=<ns> STORE=vault ./secret-store/init.sh
#
# Vault seals on every restart. Unseal with ./secret-store/unseal.sh (3 of 5
# keys), or use secret-store/openbao, which unseals itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pm4ml-vault-config
data:
  config.hcl: |
    ui = false
    disable_mlock = true
    # Integrated storage (Raft), single node: supports online snapshots, which
    # is how the store is backed up (secret-store/backup.sh). The file backend
    # it replaces had no consistent online backup.
    storage "raft" {
      path    = "/vault/file"
      node_id = "pm4ml-vault-0"
    }
    cluster_addr = "http://127.0.0.1:8201"
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true      # in-namespace only; see the NetworkPolicy below
    }
    api_addr = "http://pm4ml-vault:8200"
---
apiVersion: v1
kind: Service
metadata:
  name: pm4ml-vault
  labels: { app.kubernetes.io/name: pm4ml-vault }
spec:
  selector: { app.kubernetes.io/name: pm4ml-vault }
  # Reachable while uninitialised or sealed (readiness fails then): the
  # bootstrap and restore Jobs initialise and restore it through this Service.
  publishNotReadyAddresses: true
  ports:
    - { name: http, port: 8200, targetPort: 8200 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pm4ml-vault
  labels: { app.kubernetes.io/name: pm4ml-vault }
spec:
  serviceName: pm4ml-vault
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pm4ml-vault }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pm4ml-vault }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: vault
          image: hashicorp/vault:1.13.3
          # Bypass the image entrypoint: it tries to chown read-only mounts.
          command: ["vault", "server", "-config=/vault/config/config.hcl"]
          env:
            - { name: VAULT_ADDR, value: "http://127.0.0.1:8200" }
            - { name: SKIP_SETCAP, value: "true" }
          ports:
            - { containerPort: 8200, name: http }
          readinessProbe:      # ready = initialised and unsealed
            httpGet: { path: /v1/sys/health, port: 8200 }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /vault/config }
            - { name: data, mountPath: /vault/file }
      volumes:
        - name: config
          configMap: { name: pm4ml-vault-config }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
# Only management-api and the backup job talk to the store. Operators use `kubectl exec`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pm4ml-vault
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pm4ml-vault }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: management-api, app.kubernetes.io/instance: pm4ml }
        - podSelector:              # secret-store/backup-cronjob.yaml
            matchLabels: { app.kubernetes.io/name: store-backup, app.kubernetes.io/instance: pm4ml }
        - podSelector:              # jobs/bootstrap.yaml, jobs/restore.yaml
            matchLabels: { app.kubernetes.io/name: store-bootstrap, app.kubernetes.io/instance: pm4ml }
      ports:
        - { port: 8200 }
