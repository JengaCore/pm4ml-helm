# OPTION: OpenBao instead of Vault. Same API, so management-api needs no
# change. The difference is unsealing: OpenBao's static seal reads a 32-byte key
# from a Kubernetes Secret and unseals by itself after every restart. No one
# has to type unseal keys.
#
#   kubectl -n <ns> create secret generic pm4ml-openbao-seal \
#     --from-file=unseal.key=<(openssl rand 32)        # BACK THIS UP: lost key = lost data
#   kubectl -n <ns> apply -f secret-store/openbao/openbao.yaml
#   NS=<ns> STORE=openbao ./secret-store/init.sh
#
# Trust boundary: anyone who can read Secret pm4ml-openbao-seal can unseal the
# store. On a cloud, keep that Secret in the cloud's secret manager (External
# Secrets Operator) or use a KMS seal instead.
# The resource names are the same as in the Vault option (pm4ml-vault), so the
# Helm values do not change. Deploy one store or the other, not both.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pm4ml-vault-config
data:
  config.hcl: |
    ui = false
    disable_mlock = true
    # Integrated storage (Raft), single node: supports online snapshots, which
    # is how the store is backed up (secret-store/backup.sh). The file backend
    # it replaces had no consistent online backup.
    storage "raft" {
      path    = "/openbao/file"
      node_id = "pm4ml-vault-0"
    }
    cluster_addr = "http://127.0.0.1:8201"
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
      # management-api stores its whole state machine as one JSON document.
      # OpenBao's default limit (1000 strings per request) refuses it with
      # "refused JSON input due to high complexity"; Vault has no such limit.
      max_request_json_strings = 100000
    }
    seal "static" {
      current_key_id = "pm4ml-1"
      current_key    = "file:///openbao/seal/unseal.key"
    }
    api_addr = "http://pm4ml-vault:8200"
---
apiVersion: v1
kind: Service
metadata:
  name: pm4ml-vault
  labels: { app.kubernetes.io/name: pm4ml-vault }
spec:
  selector: { app.kubernetes.io/name: pm4ml-vault }
  ports:
    - { name: http, port: 8200, targetPort: 8200 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pm4ml-vault
  labels: { app.kubernetes.io/name: pm4ml-vault }
spec:
  serviceName: pm4ml-vault
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pm4ml-vault }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pm4ml-vault }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: vault
          image: openbao/openbao:2.6.5
          # Bypass the image entrypoint: it tries to chown read-only mounts.
          command: ["bao", "server", "-config=/openbao/config/config.hcl"]
          env:
            - { name: BAO_ADDR, value: "http://127.0.0.1:8200" }
            - { name: SKIP_SETCAP, value: "true" }
          ports:
            - { containerPort: 8200, name: http }
          readinessProbe:
            httpGet: { path: /v1/sys/health, port: 8200 }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /openbao/config }
            - { name: seal, mountPath: /openbao/seal, readOnly: true }
            - { name: data, mountPath: /openbao/file }
      volumes:
        - name: config
          configMap: { name: pm4ml-vault-config }
        - name: seal
          secret: { secretName: pm4ml-openbao-seal, defaultMode: 0400 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pm4ml-vault
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pm4ml-vault }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: management-api, app.kubernetes.io/instance: pm4ml }
        - podSelector:              # secret-store/backup-cronjob.yaml
            matchLabels: { app.kubernetes.io/name: store-backup, app.kubernetes.io/instance: pm4ml }
      ports:
        - { port: 8200 }
