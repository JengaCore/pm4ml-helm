# Scheduled, in-cluster backup of the secret store to any S3-compatible bucket
# (AWS S3, MinIO, Ceph RGW, Linode/OVH/Infomaniak object storage...).
# Works on any Kubernetes: no cloud service, no RBAC, no root token.
#
#   1. secret-store/init.sh has created Secret <release>-store-backup
#      (snapshot-only AppRole).
#   2. The bucket's credentials:
#        kubectl -n <ns> create secret generic pm4ml-backup-s3 \
#          --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=... \
#          --from-literal=AWS_DEFAULT_REGION=us-east-1 --from-literal=S3_BUCKET=<bucket> \
#          --from-literal=S3_ENDPOINT=https://<s3 endpoint>     # omit S3_ENDPOINT for AWS S3
#      (On EKS, prefer IAM Roles for Service Accounts over keys.)
#   3. kubectl -n <ns> apply -f secret-store/backup-cronjob.yaml
#      (another release: ./scripts/for-release.sh <release> secret-store/backup-cronjob.yaml)
#      Vault instead of OpenBao: change the snapshot image to hashicorp/vault:1.13.3.
#
# The bucket should have versioning and object lock (or a retention policy):
# the snapshots are the only way back to the same CA after losing the store.
# They are encrypted by the store, and useless without its unseal material.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pm4ml-store-backup
  labels: { app.kubernetes.io/name: store-backup, app.kubernetes.io/instance: pm4ml }
spec:
  schedule: "17 */6 * * *"           # every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app.kubernetes.io/name: store-backup, app.kubernetes.io/instance: pm4ml }
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: approle
              secret: { secretName: pm4ml-store-backup, defaultMode: 0400 }
            - name: out
              emptyDir: {}
          initContainers:
            - name: snapshot
              image: openbao/openbao:2.6.5
              env:
                - { name: BAO_ADDR, value: "http://pm4ml-vault:8200" }
                - { name: VAULT_ADDR, value: "http://pm4ml-vault:8200" }
              command:
                - sh
                - -ec
                - |
                  B=$(command -v bao || command -v vault)
                  T=$($B write -field=token auth/approle/login \
                        role_id="$(cat /approle/role-id)" secret_id="$(cat /approle/secret-id)")
                  BAO_TOKEN=$T VAULT_TOKEN=$T $B operator raft snapshot save /out/store.snap
                  echo "snapshot: $(wc -c < /out/store.snap) bytes"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: approle, mountPath: /approle, readOnly: true }
                - { name: out, mountPath: /out }
          containers:
            - name: upload
              image: amazon/aws-cli:2.22.0
              envFrom:
                - secretRef: { name: pm4ml-backup-s3 }
              env:
                - { name: HOME, value: /tmp }
                - { name: PREFIX, value: "pm4ml-store/" }    # one prefix per release
              command:
                - sh
                - -ec
                - |
                  key="${PREFIX}store-$(date -u +%Y%m%dT%H%M%SZ).snap"
                  aws ${S3_ENDPOINT:+--endpoint-url "$S3_ENDPOINT"} s3 cp /out/store.snap "s3://$S3_BUCKET/$key"
                  echo "uploaded s3://$S3_BUCKET/$key"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: out, mountPath: /out, readOnly: true }
