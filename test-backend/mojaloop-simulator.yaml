# TEST ONLY: a stand-in core banking system, so a DFSP can be validated
# end to end before its real core connector exists. mojaloop/mojaloop-simulator
# answers the SDK's backend API: party lookups (from its own repository, filled
# through its test API on :3003), quotes (with a fee) and transfers (accepted).
#
# Never in production: it accepts every payment and holds no money.
#
#   kubectl -n <ns> apply -f test-backend/mojaloop-simulator.yaml
#   helm ... -f helm-values/values-test-backend.yaml
#   (another release: ./scripts/for-release.sh <release> test-backend/mojaloop-simulator.yaml)
#
# The chart's own sim-backend is not used: its Deployment and Service are named
# "sim-backend" whatever the release, so two DFSPs cannot share a namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pm4ml-sim-backend-rules
data:
  rules.json: "[]"
---
apiVersion: v1
kind: Service
metadata:
  name: pm4ml-sim-backend
  labels: { app.kubernetes.io/name: sim-backend, app.kubernetes.io/instance: pm4ml }
spec:
  selector: { app.kubernetes.io/name: sim-backend, app.kubernetes.io/instance: pm4ml }
  ports:
    - { name: simapi, port: 3000, targetPort: 3000 }
    - { name: testapi, port: 3003, targetPort: 3003 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm4ml-sim-backend
  labels: { app.kubernetes.io/name: sim-backend, app.kubernetes.io/instance: pm4ml }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sim-backend, app.kubernetes.io/instance: pm4ml }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sim-backend, app.kubernetes.io/instance: pm4ml }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: mojaloop/mojaloop-simulator:v15.5.4
          ports:
            - { name: simapi, containerPort: 3000 }
            - { name: testapi, containerPort: 3003 }
          env:
            - { name: DFSP_ID, value: "CHANGE-ME-dfsp-id" }
            - { name: SIMULATOR_API_LISTEN_PORT, value: "3000" }
            - { name: REPORT_API_LISTEN_PORT, value: "3002" }
            - { name: TEST_API_LISTEN_PORT, value: "3003" }
            - { name: OUTBOUND_ENDPOINT, value: "http://pm4ml-sdk-scheme-adapter-api-svc:4001" }
            - { name: RULES_FILE, value: "/rules/rules.json" }
            - { name: MODEL_DATABASE, value: "/tmp/model.sqlite" }
            - { name: SQLITE_LOG_FILE, value: "/tmp/log.sqlite" }
            - { name: FEE_MULTIPLIER, value: "0" }
            - { name: LOG_INDENT, value: "0" }
            - { name: MUTUAL_TLS_ENABLED, value: "false" }
            - { name: HTTPS_ENABLED, value: "false" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: rules, mountPath: /rules }
      volumes:
        - name: rules
          configMap: { name: pm4ml-sim-backend-rules }
