# A production DFSP on any Kubernetes. Replace every <...>.
dfspId: <dfsp id from the hub>
switch:
  domain: <switch domain>            # e.g. prod.switch.example
  apiType: iso20022                  # as the switch
  ilpVersion: "4"
  currency: <currency>
callback:
  host: ml-connect.<your domain>     # the name now; DNS can follow (management-api waits)
  preflight:
    expectIP: <reserved IP>          # optional: enrol only once DNS points at it
  service:
    type: LoadBalancer
    loadBalancerIP: <reserved IP>    # or the provider's annotation (see values.yaml)
    loadBalancerSourceRanges: [<switch egress CIDR>]
egress:
  whitelistIps: [<your NAT IP>]
mcm:
  clientSecret: { existingSecret: <release>-mcm }   # from the hub operator, via kubectl or External Secrets
  subject: { organization: <legal name>, country: <CC>, locality: <city> }

coreConnector:
  image:
    repository: <registry>/<your core connector>
    tag: <version>
  imagePullSecrets: [ { name: <registry secret> } ]
  port: 3003
  envFromSecrets:
    CBS_API_KEY: { secret: <secret>, key: api-key }
  readinessProbe: { httpGet: { path: /health, port: 3003 } }

# Use with presets/valkey-ha.yaml (Valkey with replication, Sentinel, HAProxy):
#   helm upgrade --install <release> charts/pm4ml-dfsp -f charts/pm4ml-dfsp/presets/valkey-ha.yaml -f this-file.yaml
openbao:
  server:
    dataStorage: { enabled: true, size: 1Gi, storageClass: <encrypted class> }
    volumes:   # the seal key Secret, per release (the bootstrap Job creates it)
      - { name: seal, secret: { secretName: <release>-openbao-seal, defaultMode: 0440 } }
valkey:
  persistence: { enabled: true, size: 2Gi, storageClass: <encrypted class> }
backup:
  enabled: true
  s3Secret: <release>-backup-s3
monitoring:
  podMonitor: { enabled: true }
