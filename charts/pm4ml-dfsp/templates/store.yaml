{{- $n := include "dfsp.storeName" . -}}
{{- $bao := eq .Values.store.type "openbao" -}}
{{- $root := ternary "/openbao" "/vault" $bao -}}
{{- $sel := dict "name" "secret-store" "ctx" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}-config
  labels: {{- include "dfsp.labels" . | nindent 4 }}
data:
  config.hcl: |
    ui = false
    disable_mlock = true
    storage "raft" {
      path    = "{{ $root }}/file"
      node_id = "{{ $n }}-0"
    }
    cluster_addr = "http://127.0.0.1:8201"
    api_addr     = "http://{{ $n }}:8200"
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
      {{- if $bao }}
      max_request_json_strings = 100000
      {{- end }}
    }
    {{- if $bao }}
    seal "static" {
      current_key_id = "{{ include "dfsp.fullname" . }}-1"
      current_key    = "file:///openbao/seal/unseal.key"
    }
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
spec:
  selector: {{- include "dfsp.selector" $sel | nindent 4 }}
  publishNotReadyAddresses: true      # Jobs initialise / restore it while not ready
  ports:
    - { name: http, port: 8200, targetPort: 8200 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $n }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
    app.kubernetes.io/name: secret-store
spec:
  serviceName: {{ $n }}
  replicas: 1
  selector:
    matchLabels: {{- include "dfsp.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dfsp.labels" . | nindent 8 }}
        app.kubernetes.io/name: secret-store
      annotations:
        checksum/config: {{ .Values.store | toJson | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 100, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: store
          image: {{ ternary .Values.store.image.openbao .Values.store.image.vault $bao }}
          command: [{{ ternary "bao" "vault" $bao | quote }}, "server", "-config={{ $root }}/config/config.hcl"]
          env:
            - { name: {{ ternary "BAO_ADDR" "VAULT_ADDR" $bao }}, value: "http://127.0.0.1:8200" }
            - { name: SKIP_SETCAP, value: "true" }
          ports:
            - { name: http, containerPort: 8200 }
          readinessProbe:
            httpGet: { path: /v1/sys/health, port: 8200 }
            periodSeconds: 10
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{- toYaml .Values.store.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: {{ $root }}/config }
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: {{ $root }}/file }
            {{- if $bao }}
            - { name: seal, mountPath: /openbao/seal, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap: { name: {{ $n }}-config }
        {{- if $bao }}
        - name: seal
          secret: { secretName: {{ include "dfsp.sealSecret" . }}, defaultMode: 0440 }
        {{- end }}
        {{- if not .Values.store.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.store.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.store.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.store.persistence.size }} } }
  {{- end }}
{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $n }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "dfsp.selector" $sel | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range list "management-api" "store-backup" "bootstrap" }}
        - podSelector: { matchLabels: { app.kubernetes.io/name: {{ . }}, app.kubernetes.io/instance: {{ $.Release.Name }} } }
        {{- end }}
      ports: [ { port: 8200 } ]
{{- end }}
