{{- if .Values.monitoring.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "dfsp.fullname" . }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
    {{- with .Values.monitoring.podMonitor.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  selector:
    matchLabels: {{- include "dfsp.selector" (dict "name" "sdk-scheme-adapter" "ctx" .) | nindent 6 }}
  podMetricsEndpoints:
    - { port: metrics, path: /metrics, interval: {{ .Values.monitoring.podMonitor.interval }} }
{{- end }}
