{{- if .Values.bootstrap.enabled -}}
{{- $f := include "dfsp.fullname" . -}}
{{- $n := printf "%s-bootstrap" $f -}}
# Bootstrap: creates what the other pods wait for (they stay in ContainerCreating
# until it has run), then initialises and configures the secret store. A new
# Job per Helm revision; every step is idempotent and never replaces the DFSP CA.
{{- if .Values.bootstrap.rbac }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $n }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $n }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $f }}-vault-approle
      - {{ $f }}-store-backup
      - {{ $f }}-runtime
      - {{ include "dfsp.redisAuthSecret" . }}
      - {{ include "dfsp.sealSecret" . }}
      - {{ $f }}-tls
      - {{ $f }}-jws
      - {{ $f }}-store-init
      - {{ $f }}-store-token
      {{- with .Values.redis.external.urlSecret }}
      - {{ . }}
      {{- end }}
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $n }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $n }} }
subjects: [ { kind: ServiceAccount, name: {{ $n }} } ]
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu
    R="{{ $f }}"; A="{{ include "dfsp.storeAddr" . }}"; KIND="{{ .Values.store.type }}"
    CA_CN="{{ .Values.dfspId }} CA"; CA_O="{{ .Values.mcm.subject.organization | default .Values.dfspId }}"
    REDIS_MODE="{{ .Values.redis.mode }}"; REDIS_AUTH="{{ include "dfsp.redisAuthSecret" . }}"
    SEAL="{{ include "dfsp.sealSecret" . }}"; REDIS_HOST="{{ include "dfsp.redisHost" . }}"
    EXT_SECRET="{{ .Values.redis.external.urlSecret }}"; EXT_KEY="{{ .Values.redis.external.urlKey }}"
    say() { echo "[bootstrap] $*"; }
    rnd() { tr -dc 'a-f0-9' </dev/urandom | head -c "$1"; }
    api() {
      if [ -n "${3:-}" ]; then curl -sS -f -X "$1" -H "X-Vault-Token: ${TOKEN:-}" -H 'Content-Type: application/json' --data "$3" "$A/v1/$2"
      else curl -sS -f -X "$1" -H "X-Vault-Token: ${TOKEN:-}" "$A/v1/$2"; fi
    }
    sget() { kubectl get secret "$1" -o json 2>/dev/null | jq -r --arg k "$2" '.data[$k] // empty' | base64 -d 2>/dev/null || true; }
    sput() { n="$1"; shift; args=""; for kv in "$@"; do args="$args --from-file=$kv"; done
      # shellcheck disable=SC2086
      kubectl create secret generic "$n" $args --dry-run=client -o yaml | kubectl apply -f - >/dev/null; }
    T=$(mktemp -d)

    # 1. What the pods wait for, before the store exists.
    if [ "$KIND" = openbao ] && [ -z "$(sget "$SEAL" unseal.key)" ]; then
      head -c 32 /dev/urandom > "$T/seal"; sput "$SEAL" "unseal.key=$T/seal"
      say "created the OpenBao seal key in Secret $SEAL: BACK IT UP NOW, away from the snapshots"
    fi
    ilp="$(sget "$R-runtime" ilp-secret)"; [ -n "$ilp" ] || ilp="$(rnd 64)"; printf '%s' "$ilp" > "$T/ilp"
    case "$REDIS_MODE" in
      ha) pw="$(sget "$REDIS_AUTH" auth)"
          if [ -z "$pw" ]; then rnd 48 > "$T/pw"; sput "$REDIS_AUTH" "auth=$T/pw"; pw="$(cat "$T/pw")"; say "created Secret $REDIS_AUTH"; fi
          printf 'redis://:%s@%s:6379' "$pw" "$REDIS_HOST" > "$T/url" ;;
      single) printf 'redis://%s:6379' "$REDIS_HOST" > "$T/url" ;;
      external) sget "$EXT_SECRET" "$EXT_KEY" > "$T/url"; [ -s "$T/url" ] || { say "Secret $EXT_SECRET/$EXT_KEY is empty"; exit 1; } ;;
    esac
    sput "$R-runtime" "ilp-secret=$T/ilp" "cache-url=$T/url"
    if [ -z "$(kubectl get secret "$R-tls" -o name 2>/dev/null)" ]; then
      for f in hub-ca.pem client.pem client.key in-ca.pem server.pem server.key; do : > "$T/$f"; done
      sput "$R-tls" "hub-ca.pem=$T/hub-ca.pem" "client.pem=$T/client.pem" "client.key=$T/client.key" \
        "in-ca.pem=$T/in-ca.pem" "server.pem=$T/server.pem" "server.key=$T/server.key"
    fi

    # 2. The store.
    say "waiting for the store at $A"
    until curl -s -m 5 -o /dev/null "$A/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true"; do sleep 3; done
    TOKEN=""
    if [ "$(api GET sys/init | jq -r .initialized)" != "true" ]; then
      echo x > "$T/probe"
      kubectl create secret generic "$R-store-init" --from-file=probe="$T/probe" --dry-run=client -o yaml \
        | kubectl apply --dry-run=server -f - >/dev/null \
        || { say "cannot write Secret $R-store-init: nothing initialised"; exit 1; }
      if [ "$KIND" = openbao ]; then body='{"recovery_shares":5,"recovery_threshold":3}'; else body='{"secret_shares":5,"secret_threshold":3}'; fi
      api PUT sys/init "$body" > "$T/init.json"
      sput "$R-store-init" "init.json=$T/init.json"
      say "initialised: keys and root token in Secret $R-store-init. Move them to escrow and delete the Secret."
      if [ "$KIND" = vault ]; then
        for i in 0 1 2; do api PUT sys/unseal "$(jq -c "{key: .keys_base64[$i]}" "$T/init.json")" >/dev/null; done
      fi
      TOKEN=$(jq -r .root_token "$T/init.json")
      until [ "$(curl -s "$A/v1/sys/seal-status" | jq -r .sealed)" = "false" ]; do sleep 2; done
    else
      TOKEN="$(sget "$R-store-token" token)"
      [ -n "$TOKEN" ] || TOKEN="$(sget "$R-store-init" init.json | jq -r '.root_token // empty' 2>/dev/null || true)"
    fi
    if [ -z "$TOKEN" ]; then say "store initialised, no token given (escrowed): configuration not re-applied"; exit 0; fi
    until [ "$(curl -s "$A/v1/sys/seal-status" | jq -r .sealed)" = "false" ]; do say "store sealed: waiting (Vault: unseal it)"; sleep 10; done
    api GET sys/auth | jq -e '."approle/"' >/dev/null || api POST sys/auth/approle '{"type":"approle"}' >/dev/null
    mounts=$(api GET sys/mounts)
    echo "$mounts" | jq -e '."pki/"' >/dev/null || { api POST sys/mounts/pki '{"type":"pki"}' >/dev/null; api POST sys/mounts/pki/tune '{"max_lease_ttl":"97600h"}' >/dev/null; }
    echo "$mounts" | jq -e '."secrets/"' >/dev/null || api POST sys/mounts/secrets '{"type":"kv","options":{"version":"1"}}' >/dev/null
    if [ -z "$(curl -s "$A/v1/pki/cert/ca" -H "X-Vault-Token: $TOKEN" | jq -r '.data.certificate // empty')" ]; then
      api POST pki/root/generate/internal "$(jq -cn --arg cn "$CA_CN" --arg o "$CA_O" '{common_name:$cn, organization:$o, ttl:"97600h"}')" >/dev/null
      say "created the DFSP CA: $CA_CN"
    fi
    for r in client-cert-role server-cert-role; do
      api POST "pki/roles/$r" '{"allow_any_name":true,"allow_subdomains":true,"allow_localhost":true,"enforce_hostnames":false,"require_cn":false,"max_ttl":"97600h"}' >/dev/null
    done
    api PUT sys/policies/acl/management-api "$(jq -cn --arg p 'path "pki/*" { capabilities = ["create","read","update","delete","list","sudo"] }
    path "secrets/*" { capabilities = ["create","read","update","delete","list"] }
    path "sys/mounts" { capabilities = ["read"] }
    path "sys/mounts/*" { capabilities = ["create","read","update"] }' '{policy:$p}')" >/dev/null
    api PUT sys/policies/acl/store-backup "$(jq -cn --arg p 'path "sys/storage/raft/snapshot" { capabilities = ["read"] }' '{policy:$p}')" >/dev/null
    api POST auth/approle/role/management-api '{"token_policies":["management-api"],"secret_id_ttl":"0","token_ttl":"1h","token_max_ttl":"24h"}' >/dev/null
    api POST auth/approle/role/store-backup '{"token_policies":["store-backup"],"secret_id_ttl":"0","token_ttl":"15m","token_max_ttl":"1h"}' >/dev/null
    for pair in "management-api:$R-vault-approle" "store-backup:$R-store-backup"; do
      role=${pair%%:*}; sec=${pair#*:}
      if [ -z "$(sget "$sec" secret-id)" ]; then
        api GET "auth/approle/role/$role/role-id" | jq -j .data.role_id > "$T/role-id"
        api POST "auth/approle/role/$role/secret-id" | jq -j .data.secret_id > "$T/secret-id"
        sput "$sec" "role-id=$T/role-id" "secret-id=$T/secret-id"; say "created Secret $sec"
      fi
    done
    if [ -z "$(sget "$R-jws" jws-signing.key)" ]; then
      api POST pki/issue/server-cert-role '{"common_name":"jws-placeholder","ttl":"1h"}' | jq -j .data.private_key > "$T/jws.key"
      sput "$R-jws" "jws-signing.key=$T/jws.key"
    fi
    say "done"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $n }}-{{ .Release.Revision }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {{- include "dfsp.labels" . | nindent 8 }}
        app.kubernetes.io/name: bootstrap
    spec:
      serviceAccountName: {{ $n }}
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image }}
          command: ["sh", "/scripts/bootstrap.sh"]
          env: [ { name: HOME, value: /tmp } ]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
          volumeMounts:
            - { name: script, mountPath: /scripts }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: script
          configMap: { name: {{ $n }} }
        - name: tmp
          emptyDir: {}
{{- end }}
