{{- if .Values.backup.enabled -}}
{{- $f := include "dfsp.fullname" . -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $f }}-store-backup
  labels: {{- include "dfsp.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {{- include "dfsp.labels" . | nindent 12 }}
            app.kubernetes.io/name: store-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, runAsUser: 100, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
          volumes:
            - name: approle
              secret: { secretName: {{ $f }}-store-backup, defaultMode: 0440 }
            - name: out
              emptyDir: {}
            - name: home
              emptyDir: {}
          initContainers:
            - name: snapshot
              image: {{ ternary .Values.store.image.openbao .Values.store.image.vault (eq .Values.store.type "openbao") }}
              env:
                - { name: BAO_ADDR, value: {{ include "dfsp.storeAddr" . | quote }} }
                - { name: VAULT_ADDR, value: {{ include "dfsp.storeAddr" . | quote }} }
                - { name: HOME, value: /tmp }
              command:
                - sh
                - -ec
                - |
                  B=$(command -v bao || command -v vault)
                  T=$($B write -field=token auth/approle/login role_id="$(cat /approle/role-id)" secret_id="$(cat /approle/secret-id)")
                  BAO_TOKEN=$T VAULT_TOKEN=$T $B operator raft snapshot save /out/store.snap
                  echo "snapshot: $(wc -c < /out/store.snap) bytes"
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
              volumeMounts:
                - { name: approle, mountPath: /approle, readOnly: true }
                - { name: out, mountPath: /out }
                - { name: home, mountPath: /tmp }
          containers:
            - name: upload
              image: {{ .Values.backup.image }}
              envFrom: [ { secretRef: { name: {{ required "backup.s3Secret is required when backup.enabled" .Values.backup.s3Secret }} } } ]
              env:
                - { name: HOME, value: /tmp }
                - { name: PREFIX, value: {{ .Values.backup.prefix | default (printf "%s-store/" $f) | quote }} }
              command:
                - sh
                - -ec
                - |
                  key="${PREFIX}store-$(date -u +%Y%m%dT%H%M%SZ).snap"
                  aws ${S3_ENDPOINT:+--endpoint-url "$S3_ENDPOINT"} s3 cp /out/store.snap "s3://$S3_BUCKET/$key"
                  echo "uploaded s3://$S3_BUCKET/$key"
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
              volumeMounts: [ { name: out, mountPath: /out, readOnly: true }, { name: home, mountPath: /tmp } ]
{{- end }}
