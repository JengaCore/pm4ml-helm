{{- if eq .Values.redis.mode "single" -}}
{{- $n := printf "%s-redis" (include "dfsp.fullname" .) -}}
{{- $sel := dict "name" "redis" "ctx" . -}}
# TEST ONLY: one Redis. A crash fails the payments in flight (validated: 13/60).
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
spec:
  selector: {{- include "dfsp.selector" $sel | nindent 4 }}
  ports: [ { name: redis, port: 6379, targetPort: 6379 } ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $n }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  serviceName: {{ $n }}
  replicas: 1
  selector:
    matchLabels: {{- include "dfsp.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dfsp.labels" . | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.single.image }}
          args: ["--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
          ports: [ { name: redis, containerPort: 6379 } ]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          volumeMounts: [ { name: data, mountPath: /data } ]
      {{- if not .Values.redis.single.persistence.enabled }}
      volumes: [ { name: data, emptyDir: {} } ]
      {{- end }}
  {{- if .Values.redis.single.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redis.single.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.single.persistence.size }} } }
  {{- end }}
{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $n }}
  labels: {{- include "dfsp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "dfsp.selector" $sel | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from: [ { podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } } } ]
      ports: [ { port: 6379 } ]
{{- end }}
{{- end }}
