apiVersion: v2
name: pm4ml-dfsp
description: >-
  Payment Manager for Mojaloop (PM4ML) for a DFSP joining a Mojaloop switch:
  the SDK scheme adapter, management-api (MCM enrolment), the DFSP's own core
  connector, a secret store (OpenBao or Vault), Redis, backups and the mutual-TLS
  callback edge, configured from one values file.
type: application
version: 0.2.2
appVersion: "v24.19.3"
keywords: [mojaloop, pm4ml, dfsp, payments]
home: https://github.com/JengaCore/pm4ml-helm
sources:
  - https://github.com/JengaCore/pm4ml-helm
  - https://github.com/mojaloop/sdk-scheme-adapter
  - https://github.com/pm4ml/mojaloop-payment-manager-management-api
kubeVersion: ">=1.27.0-0"
maintainers:
  - name: jengacore
    url: https://jengacore.com
dependencies:
  # Upstream charts, pinned. Presets for them live in values.yaml and presets/.
  - name: openbao
    version: 0.30.7
    repository: https://openbao.github.io/openbao-helm
    condition: openbao.enabled
  - name: vault
    version: 0.34.1
    repository: https://helm.releases.hashicorp.com
    condition: vault.enabled
  - name: valkey
    version: 1.0.0
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
