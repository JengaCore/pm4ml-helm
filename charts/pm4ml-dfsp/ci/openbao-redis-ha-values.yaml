# CI: OpenBao, Valkey HA (presets/valkey-ha.yaml), LoadBalancer callback.
dfspId: ci-dfsp
switch: { domain: switch.example.test, currency: USD }
callback:
  host: ml-connect.ci.example.test
  preflight: { enabled: false }
egress: { whitelistIps: [192.0.2.10] }
mcm: { subject: { organization: CI DFSP, country: RW, locality: Kigali } }
openbao:
  server:
    volumes:
      - { name: seal, secret: { secretName: ci-openbao-seal, defaultMode: 0440 } }   # CI installs the release as "ci"
valkey:
  replica: { enabled: true, replicas: 3 }
  sentinel: { enabled: true, replicas: 3 }
  haproxy: { enabled: true, replicas: 2 }
