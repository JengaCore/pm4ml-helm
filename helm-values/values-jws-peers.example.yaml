# STATIC MODE ONLY. Peer JWS public keys (public; safe to commit).
# Copy to values-jws-peers.yaml. Must contain "Hub" (the hub signs commit
# notifications as Hub) and every DFSP you receive messages from.
scheme-adapter:
  sdk-scheme-adapter-api-svc:
    config:
      jwsVerificationKeys:
        Hub: |
          -----BEGIN PUBLIC KEY-----
          CHANGE-ME
          -----END PUBLIC KEY-----
        peer-dfsp-id: |
          -----BEGIN PUBLIC KEY-----
          CHANGE-ME
          -----END PUBLIC KEY-----
