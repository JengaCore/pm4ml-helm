# OPTION: static mode. No management-api, no secret store.
#
#   -f values-pm4ml.yaml -f values-static.yaml -f values-jws-peers.yaml
#
# Certificates, JWS keys and the peer key list are files you manage
# (scripts/create-static-secrets.sh). Onboarding and renewal are manual: the
# hub operator signs your CSR in MCM, you download the certificate, and you
# re-run the script before it expires. Peer keys change whenever a DFSP joins
# the scheme. Fine for a pilot. For anything larger, use the default mode.
# This is how ThitsaX/pm4ml-deployment runs.
management-api:
  enabled: false

scheme-adapter:
  sdk-scheme-adapter-api-svc:
    config:
      jwsVerificationKeys: null     # comes from values-jws-peers.yaml
    env:
      PM4ML_ENABLED: false
      MGMT_API_WS_URL: null
      MGMT_API_WS_PORT: null
      MANAGEMENT_API_POLL_INTERVAL_MS: null
