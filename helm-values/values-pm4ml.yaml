# PM4ML on Kubernetes: default values.
#
# Defaults follow JengaCore/pm4ml-docker-compose (default-config.env,
# .env.example, docker-compose.yaml), so a DFSP behaves the same on Compose or
# on Kubernetes. Where this file differs, docs/OPTIONS.md says why.
#
# Default mode is MCM: management-api enrols with the hub's MCM, keeps the
# DFSP's CA and keys in the secret store (Vault by default, as in Compose), and
# pushes certificates and JWS keys to the SDK over the control channel.
# For the mode without management-api and Vault, add values-static.yaml.
#
# Fill every CHANGE ME. Values marked HUB come from the hub operator.
# No secret goes in this file. Secrets are Kubernetes Secrets (README, step 3).

dfspId: &dfspId "CHANGE-ME-dfsp-id"          # HUB: exactly as registered in MCM

# ---------------------------------------------------------------------------
# What runs
# ---------------------------------------------------------------------------
ingress:
  enabled: false
testIngress:          # the chart's catch-all test Ingress; never wanted
  enabled: false
frontend:             # portal UI: optional, see docs/OPTIONS.md
  enabled: false
experience-api:
  enabled: false
keycloak:
  enabled: false
vault:                # the chart's bundled Vault (chart 0.14.0) is not used;
  enabled: false      # deploy secret-store/vault or secret-store/openbao
prometheus:
  enabled: false
redis:                # the bundled Bitnami image is no longer published;
  enabled: false      # deploy redis/redis.yaml or bring your own
ttk:
  enabled: false
sim-backend:
  enabled: false
cbs-mock:
  enabled: false
mojaloop-payment-token-adapter:
  enabled: false

# ---------------------------------------------------------------------------
# management-api (MCM client)
# ---------------------------------------------------------------------------
management-api:
  enabled: true
  image:
    tag: "7.0.0"                        # = Compose
  env:
    DFSP_ID: *dfspId
    AUTH_ENABLED: "true"
    AUTH_CLIENT_ID: *dfspId             # = DFSP id (Compose: AUTH_CLIENT_ID)
    CLIENT_SECRET_NAME: pm4ml-mcm       # Secret with the client secret from the hub
    CLIENT_SECRET_KEY: client-secret
    HUB_IAM_PROVIDER_URL: "https://keycloak.CHANGE-ME-switch-domain"        # HUB
    MCM_SERVER_ENDPOINT: "https://mcm.CHANGE-ME-switch-domain/pm4mlapi"     # HUB
    MOJALOOP_CONNECTOR_FQDN: "ml-connect.CHANGE-ME-pm4ml-domain"
    CALLBACK_URL: "https://ml-connect.CHANGE-ME-pm4ml-domain"
    # Egress IPs the hub should allow. Bare IPv4, comma-separated: the
    # JengaCore MCM rejects CIDR (1.2.3.4/32), even though .env.example shows it.
    WHITELIST_IP: "CHANGE-ME-egress-ip"
    # CACHE_URL: from Secret pm4ml-runtime, key cache-url (post-renderer)
    CACHE_SYNC_INTERVAL_SECONDS: "30"
    CONTROL_LISTEN_PORT: "4005"
    ENABLE_CORS: "true"
    PRIVATE_KEY_ALGORITHM: rsa          # the hub rejects EC CAs
    PRIVATE_KEY_LENGTH: "4096"
    CA_CSR_PARAMETERS: /resources/caCSRParameters.json
    DFSP_CLIENT_CSR_PARAMETERS: /resources/tlsClientCSRParameters.json
    DFSP_SERVER_CSR_PARAMETERS: /resources/tlsServerCSRParameters.json
    CERT_MANAGER_ENABLED: "false"
    # Secret store (Vault API; Vault or OpenBao). AppRole, as in Compose.
    VAULT_ENDPOINT: "http://pm4ml-vault:8200"
    VAULT_AUTH_METHOD: APP_ROLE
    VAULT_ROLE_ID_FILE: /vault/auth-data/role-id
    VAULT_ROLE_SECRET_ID_FILE: /vault/auth-data/secret-id
    VAULT_MOUNT_PKI: pki
    VAULT_MOUNT_KV: secrets
    VAULT_PKI_CLIENT_ROLE: client-cert-role
    VAULT_PKI_SERVER_ROLE: server-cert-role
    # Not used with APP_ROLE, but the chart sets them; harmless.
    VAULT_K8S_ROLE: unused
  # Subject fields of the DFSP's CA and certificates (Compose:
  # docker/management-api/resources/*.json). Use your organisation's names.
  config:
    caCSRParametersData: |-
      { "CN": "CHANGE-ME-dfsp-id CA", "O": "CHANGE ME", "OU": "Payments", "C": "CHANGE ME", "ST": "CHANGE ME", "L": "CHANGE ME", "E": "CHANGE-ME@example.com" }
    tlsClientCSRParametersData: |-
      { "subject": { "CN": "CHANGE-ME-dfsp-id", "O": "CHANGE ME", "OU": "Payments", "C": "CHANGE ME", "L": "CHANGE ME" },
        "extensions": { "subjectAltName": { "dns": [], "ips": [] } } }
    tlsServerCSRParametersData: |-
      { "subject": { "CN": "ml-connect.CHANGE-ME-pm4ml-domain", "O": "CHANGE ME", "OU": "Payments", "C": "CHANGE ME", "L": "CHANGE ME" },
        "extensions": { "subjectAltName": { "dns": ["ml-connect.CHANGE-ME-pm4ml-domain"], "ips": [] } } }
  ingress:
    enabled: false
  # One replica by design: it owns the enrolment state machine in the store.
  # The SDK keeps running on the certificates it already has while it restarts.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# ---------------------------------------------------------------------------
# Core connector: replace with your own. The simulator is for tests only.
# ---------------------------------------------------------------------------
mojaloop-core-connector:
  image:
    repository: pm4ml/mojaloop-payment-manager-simulator-core-connector
    tag: "1.4.5"
  replicaCount: 1
  env:
    BACKEND_ENDPOINT: "http://CHANGE-ME-core-banking:8081"
    MLCONN_OUTBOUND_ENDPOINT: "http://pm4ml-sdk-scheme-adapter-api-svc:4001"
    DFSP_NAME: "CHANGE ME"
    DFSP_CURRENCY: "CHANGE-ME"          # HUB
    SUPPORTED_CURRENCIES: "CHANGE-ME"   # HUB
    DFSP_LOCALE: "en_US"
    DECIMAL_PLACES: "2"
    SDK_CONNECTOR_PORT: "3003"
    CACHE_LIFE_TIME: "30"
    DFSP_ENCRYPT_KYC: "false"
    IS_PREFIX: "false"
  envFromSecrets:
    REDIS_URL:                          # same Redis URL as the SDK, from the Secret
      secret: { name: pm4ml-runtime, key: cache-url }
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false
  resources:                            # size for your own connector; the simulator
    requests: { cpu: 100m, memory: 512Mi } # image (Java) was OOM-killed at 256Mi
    limits: { memory: 1Gi }

# ---------------------------------------------------------------------------
# SDK scheme adapter (default-config.env + docker-compose.yaml)
# ---------------------------------------------------------------------------
scheme-adapter:
  sdk-scheme-adapter-api-svc:
    image:
      tag: v24.19.3                     # = Compose SDK_IMAGE_TAG
    # Production: 2+ replicas on different nodes (the chart's soft pod
    # anti-affinity), a PodDisruptionBudget (post-render/pdb.yaml) and a
    # graceful stop (post-render: preStop + 60 s grace). Replicas share state
    # through Redis, so any replica can take any callback. Compose runs 1.
    replicaCount: 2
    redis:
      host: pm4ml-redis
      port: 6379
    config:
      simName: *dfspId
      # management-api pushes the real JWS key and the peer keys over the
      # control channel. The chart still needs a key Secret and one peer key
      # to start; scripts/init-placeholders.sh creates them (Compose ships the
      # same kind of placeholders in docker/sdk-scheme-adapter/).
      jwsSigningKeySecret:
        name: pm4ml-jws
        key: jws-signing.key
      jwsVerificationKeys:
        placeholder: |
          replaced by management-api over the control channel
    env:
      DFSP_ID: *dfspId
      LOG_LEVEL: info
      API_TYPE: fspiop                  # HUB: fspiop | iso20022 (Compose default fspiop)
      ILP_VERSION: "4"                  # = Compose
      SUPPORTED_CURRENCIES: "CHANGE-ME" # HUB
      PM4ML_ENABLED: true
      MGMT_API_WS_URL: pm4ml-management-api
      MGMT_API_WS_PORT: "4005"
      MANAGEMENT_API_POLL_INTERVAL_MS: "30000"

      # Switch endpoints: fspiop.<switch domain> (iso20022: extapi.<switch domain>)
      PEER_ENDPOINT: "fspiop.CHANGE-ME-switch-domain"
      ALS_ENDPOINT: "fspiop.CHANGE-ME-switch-domain"
      FX_QUOTES_ENDPOINT: "fspiop.CHANGE-ME-switch-domain"
      FX_TRANSFERS_ENDPOINT: "fspiop.CHANGE-ME-switch-domain"
      BACKEND_ENDPOINT: "pm4ml-mojaloop-core-connector:3003"

      # Token for FSPIOP calls, from the hub's dfsps realm (= Compose).
      # OAUTH_CLIENT_SECRET comes from the pm4ml-mcm Secret (post-renderer).
      OAUTH_CLIENT_KEY: *dfspId
      OAUTH_TOKEN_ENDPOINT: "https://keycloak.CHANGE-ME-switch-domain/realms/dfsps/protocol/openid-connect/token"
      OAUTH_REFRESH_SECONDS: "250"
      WSO2_AUTH_FAILURE_REQUEST_RETRIES: "2"
      ENABLE_OAUTH_TOKEN_ENDPOINT: false

      # mTLS both ways. In MCM mode the files below are empty placeholders and
      # management-api supplies the certificates over the control channel.
      INBOUND_MUTUAL_TLS_ENABLED: true
      OUTBOUND_MUTUAL_TLS_ENABLED: true
      IN_CA_CERT_PATH: /secrets/tls/in-ca.pem
      IN_SERVER_CERT_PATH: /secrets/tls/server.pem
      IN_SERVER_KEY_PATH: /secrets/tls/server.key
      OUT_CA_CERT_PATH: /secrets/tls/hub-ca.pem
      OUT_CLIENT_CERT_PATH: /secrets/tls/client.pem
      OUT_CLIENT_KEY_PATH: /secrets/tls/client.key

      JWS_SIGN: true
      VALIDATE_INBOUND_JWS: true
      JWS_SIGNING_KEY_PATH: /jwsSigningKey.key
      JWS_VERIFICATION_KEYS_DIRECTORY: /jwsVerificationKeys

      AUTO_ACCEPT_PARTY: true           # = Compose
      AUTO_ACCEPT_QUOTES: false
      AUTO_ACCEPT_R2P_PARTY: false
      AUTO_ACCEPT_PARTICIPANTS_PUT: true
      RESERVE_NOTIFICATION: true
      REQUEST_PROCESSING_TIMEOUT_SECONDS: "30"
      DEFAULT_REQUEST_TIMEOUT: "60000"
      MULTIPLE_PARTIES_RESPONSE: false
      ENABLE_BACKEND_EVENT_HANDLER: false
      ENABLE_FSPIOP_EVENT_HANDLER: false
      ENABLE_TEST_FEATURES: true        # = Compose; test API port 4002 stays cluster-internal
      FSPIOP_API_SERVER_MAX_REQUEST_BYTES: "209715200"
      BACKEND_API_SERVER_MAX_REQUEST_BYTES: "209715200"
      RESOURCE_VERSIONS: "transfers=2.0,quotes=2.0,participants=2.0,parties=2.0,transactionRequests=1.1"
      # CACHE_URL and ILP_SECRET: from Secret pm4ml-runtime (post-renderer).
      # redis.host above only feeds the chart's wait-for-redis init container.
