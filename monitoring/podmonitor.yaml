# For clusters with the Prometheus Operator. Without it, the SDK pods already
# carry prometheus.io/scrape + prometheus.io/port=4004 annotations.
#   kubectl -n <ns> apply -f monitoring/podmonitor.yaml        (or for-release.sh)
#
# What to alert on (metric names as exported by sdk-scheme-adapter v24):
#   rate(mojaloop_connector_outbound_transfer_prepare_count[5m]) vs
#   rate(mojaloop_connector_outbound_transfer_fulfil_response_count[5m])
#                                     -> payments sent but not answered
#   histogram_quantile(0.95, rate(mojaloop_connector_outbound_transfer_latency_bucket[5m]))
#   mojaloop_connector_default_nodejs_eventloop_lag_p99_seconds > 0.2
#                                     -> the replica's single event loop is saturated: add replicas
#   kube_deployment_status_replicas_available{deployment=~".*-management-api"} == 0
#                                     -> no certificate renewal, no new peer keys (payments continue)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pm4ml
spec:
  selector:
    matchLabels: { app.kubernetes.io/instance: pm4ml }
  podMetricsEndpoints:
    - port: metrics          # SDK, 4004
      path: /metrics
      interval: 30s
