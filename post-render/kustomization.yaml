# Applied by post-render.sh to the chart output on every install and upgrade.
# The charts cannot mount these Secrets or read env from them, so it is done here.
resources:
  - all.yaml
  - pdb.yaml
patches:
  - path: sdk-scheme-adapter.yaml
    target:
      kind: Deployment
      name: .*sdk-scheme-adapter-api-svc
  - path: management-api.yaml
    target:
      kind: Deployment
      name: .*management-api
