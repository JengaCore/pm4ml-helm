apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdk-scheme-adapter-api-svc
spec:
  template:
    spec:
      automountServiceAccountToken: false
      # Graceful rollout / scale-in: the pod leaves the Service at once, and
      # preStop keeps it alive long enough for payments already in flight to
      # get their callbacks (REQUEST_PROCESSING_TIMEOUT_SECONDS = 30) before
      # SIGTERM closes Redis and the listeners. Without it, killing a replica
      # mid-load failed in-flight payments that the ledger still committed.
      terminationGracePeriodSeconds: 60
      volumes:
        - name: pm4ml-tls
          secret:
            secretName: pm4ml-tls      # empty placeholders in MCM mode
            defaultMode: 0400
      containers:
        - name: sdk-scheme-adapter-api-svc
          # The chart has no resources value for the SDK. Sized from the
          # 2026-11-18 load test (~6 payments/s on 3 replicas, ~200 MiB RSS
          # each); one Node.js event loop uses at most one core.
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 35"]
          volumeMounts:
            - name: pm4ml-tls
              mountPath: /secrets/tls
              readOnly: true
          env:
            - name: ILP_SECRET
              value: null
              valueFrom:
                secretKeyRef: { name: pm4ml-runtime, key: ilp-secret }
            # Redis URL from the Secret: it may carry a password (redis://:pw@host)
            # or TLS (rediss://, e.g. ElastiCache with in-transit encryption).
            - name: CACHE_URL
              value: null
              valueFrom:
                secretKeyRef: { name: pm4ml-runtime, key: cache-url }
            - name: OAUTH_CLIENT_SECRET
              value: null
              valueFrom:
                secretKeyRef: { name: pm4ml-mcm, key: client-secret, optional: true }
